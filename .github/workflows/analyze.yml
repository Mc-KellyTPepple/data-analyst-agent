name: Analyze results

# Categorises the wrong answers in the stored benchmark results (wrong columns, wrong row count, wrong values)
# and commits results/diagnostics.jsonl. Uses no Groq requests.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/fetch_spider.py
      - name: Analyze
        run: python -m analyst analyze | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A results
          git diff --cached --quiet || git commit -m "Diagnostics"
          git pull --rebase -X theirs && git push
