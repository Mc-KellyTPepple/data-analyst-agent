name: Benchmark on Spider

# Runs the Spider development-set sample through Groq's free tier, grades execution accuracy, and commits the
# results, the response cache and the daily request ledger. Runs are resumable: finished questions are skipped,
# so when a daily quota runs out the run stops cleanly and the nightly run continues it.
#
# One-time setup: add the repository SECRET GROQ_API_KEY (from console.groq.com/keys).

on:
  schedule:
    - cron: "15 2 * * *"      # after Groq's daily reset at 00:00 UTC, and after the EDGAR Analyst nightly run
  workflow_dispatch:
    inputs:
      configs:
        description: "Space-separated configurations: oneshot agent agent_1try agent_nosamples"
        default: "oneshot agent agent_1try agent_nosamples"
      n:
        description: "Sample size (questions spread across databases)"
        default: "100"
      seed:
        description: "Sample seed"
        default: "1"
      max_requests:
        description: "Max Groq requests per configuration this run"
        default: "900"
      models:
        description: "Comma-separated Groq models, preferred first (empty = both gpt-oss-120b and gpt-oss-20b, each on its own result files)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check setup
        run: '[ -n "$GROQ_API_KEY" ] || { echo "::error::Add the GROQ_API_KEY repository secret."; exit 1; }'
      - run: pip install -e .
      - name: Fetch Spider development set
        run: python scripts/fetch_spider.py
      - name: Run benchmark
        run: |
          configs="${{ inputs.configs }}"; configs="${configs:-oneshot agent agent_1try agent_nosamples}"
          n="${{ inputs.n }}"; n="${n:-100}"
          seed="${{ inputs.seed }}"; seed="${seed:-1}"
          max="${{ inputs.max_requests }}"; max="${max:-900}"
          models="${{ inputs.models }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ -z "$models" ]; then
            model_list="openai/gpt-oss-120b openai/gpt-oss-20b"   # each model has its own free daily quota, so both progress every night
          else
            model_list="$models"
          fi
          for m in $model_list; do
            # headline comparison first (cheap baseline, then the agent), on the main sample and on a held-out sample with another seed
            for c in oneshot agent; do
              python -m analyst bench --config $c --n $n --seed $seed --max-requests $max --models "$m"
            done
            for c in oneshot agent; do
              python -m analyst bench --config $c --n $n --seed 2 --max-requests $max --models "$m"
            done
            # ablation arms last: they cost the most tokens
            for c in $configs; do
              case $c in oneshot|agent) ;; *) python -m analyst bench --config $c --n $n --seed $seed --max-requests $max --models "$m";; esac
            done
          done
      - name: Report
        if: always()
        run: python -m analyst report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A results
          git diff --cached --quiet || git commit -m "Benchmark results"
          git pull --rebase -X theirs && git push
